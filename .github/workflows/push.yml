name: Push CD

# Expected secrets:
# - DOCKER_REGISTRY_TOKEN
# - CUSTOM_REGISTRY_TOKEN

# Expected variables:
# - DOCKER_REGISTRY_ENABLED
# - DOCKER_REGISTRY_USERNAME
# - GITHUB_REGISTRY_ENABLED
# - CUSTOM_REGISTRY_URL
# - CUSTOM_REGISTRY_USERNAME
# - CUSTOM_REGISTRY_NAMESPACE
# - IMAGES_PREFIX

on:

  # Run on push on production branches
  push:
    branches:
      # Production
      - main
    paths:
      # CI files
      - '.github/workflows/push.yml'
      - 'docker-compose.yml'
      - '.env'
      # Application files
      - 'chown-command.sh'
      - 'Dockerfile'

  # Run on manual triggers
  workflow_dispatch:
    inputs:
      deploy_env:
        description: 'Deployment environment (e.g. prod, staging)'
        type: string

# Set default GITHUB_TOKEN permissions for the workflow
permissions:
  contents: read

# Set workflow concurrency rules
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Set environment variables for the workflow
env:
  DOCKER_REGISTRY_ENABLED: ${{ vars.DOCKER_REGISTRY_ENABLED == 'true' }}
  GITHUB_REGISTRY_ENABLED: ${{ vars.GITHUB_REGISTRY_ENABLED == 'true' }}
  IMAGES_PREFIX: ${{ vars.IMAGES_PREFIX }}

jobs:

  # Build & Push job
  push:
    name: Build & Push
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # Set GITHUB_TOKEN permissions for the job
    permissions:
      packages: write

    steps:

      # Initialization steps

      - name: Checkout
        uses: actions/checkout@v4

      # Dependencies steps

      - name: Install cURL
        run: |
          # Install cURL

          echo '::group::Update package lists'
          sudo apt-get -q update
          echo '::endgroup::'

          echo '::group::Install cURL'
          sudo apt-get -qy install --no-install-recommends curl
          echo '::endgroup::'

          echo '::group::Print cURL version'
          curl --version
          echo '::endgroup::'

      - name: Install Compose CLI plugin
        # See all releases: https://github.com/docker/compose/releases
        env:
          COMPOSE_VERSION: v2.40.3
          COMPOSE_ARCH: linux-x86_64
        run: |
          # Install Compose CLI plugin

          echo '::group::Install Compose CLI plugin'
          DOCKER_CONFIG="${DOCKER_CONFIG:-/usr/local/lib/docker}"
          sudo mkdir -p "$DOCKER_CONFIG/cli-plugins"
          sudo curl -SL \
            "https://github.com/docker/compose/releases/download/${COMPOSE_VERSION}/docker-compose-${COMPOSE_ARCH}" \
            -o "$DOCKER_CONFIG/cli-plugins/docker-compose"
          sudo chmod +x "$DOCKER_CONFIG/cli-plugins/docker-compose"
          echo '::endgroup::'

          echo '::group::Print docker & docker compose versions'
          docker --version
          docker compose version
          echo '::endgroup::'

      - name: Install yq
        # See all releases: https://github.com/mikefarah/yq/releases
        env:
          YQ_VERSION: v4.49.2
          YQ_ARCH: linux_amd64
        run: |
          # Install yq

          echo '::group::Install yq'
          sudo curl -SL \
            "https://github.com/mikefarah/yq/releases/download/${YQ_VERSION}/yq_${YQ_ARCH}" \
            -o '/usr/local/bin/yq'
          sudo chmod +x '/usr/local/bin/yq'
          echo '::endgroup::'

          echo '::group::Print yq version'
          yq --version
          echo '::endgroup::'

      - name: Load helper scripts
        run: |
          # Load helper scripts

          . ./.github/workflows/scripts/set_github_env.sh
          . ./.github/workflows/scripts/set_registry_credentials.sh

      # Preparation steps

      - name: Set DEPLOY_ENV
        env:
          GITHUB_REF: ${{ github.ref }}
          DEPLOY_ENV: ${{ github.event.inputs.deploy_env }}
        run: |
          # Set DEPLOY_ENV environment variable

          if [ -n "${DEPLOY_ENV}" ]; then
            # Sanitize DEPLOY_ENV value:
            # - Strip leading & trailing whitespace
            # - Remove punctuation
            # - Convert to uppercase
            # - Replace spaces with underscores
            DEPLOY_ENV="$(
              echo "${DEPLOY_ENV}" \
              | xargs \
              | tr -d '[:punct:]' \
              | tr '[:lower:] ' '[:upper:]_'
            )"
          elif [ "${GITHUB_REF}" = "refs/heads/main" ]; then
            DEPLOY_ENV="PROD"
          else
            DEPLOY_ENV="STAGING"
          fi

          echo "Set DEPLOY_ENV to '${DEPLOY_ENV}'"
          echo 'DEPLOY_ENV<<GITHUB_ENV_EOF' >> $GITHUB_ENV
          echo "${DEPLOY_ENV}" >> $GITHUB_ENV
          echo 'GITHUB_ENV_EOF' >> $GITHUB_ENV

      - name: Set Docker Hub registry credentials
        if: env.DOCKER_REGISTRY_ENABLED
        env:
          REGISTRY_URL: docker.io
          REGISTRY_USERNAME: ${{ vars.DOCKER_REGISTRY_USERNAME }}
          REGISTRY_TOKEN: ${{ secrets.DOCKER_REGISTRY_TOKEN }}
          REGISTRY_NAMESPACE: ${{ vars.DOCKER_REGISTRY_USERNAME }}
          IMAGES_PREFIX: ${{ env.IMAGES_PREFIX }}
          REPOSITORY_OWNER: ${{ github.repository_owner }}
          REPOSITORY_PATH: ${{ github.repository }}
        run: |
          # Set Docker Hub registry credentials
          set_registry_credentials \
            'DOCKER_REGISTRY_URL' \
            'DOCKER_REGISTRY_IMAGES_PREFIX' \
            'DOCKER_REGISTRY_USERNAME' \
            'DOCKER_REGISTRY_TOKEN'

      - name: Set GitHub registry credentials
        if: env.GITHUB_REGISTRY_ENABLED
        env:
          REGISTRY_URL: ghcr.io
          REGISTRY_USERNAME: ${{ github.actor }}
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REGISTRY_NAMESPACE: ${{ github.repository_owner }}
          IMAGES_PREFIX: ${{ env.IMAGES_PREFIX }}
          REPOSITORY_OWNER: ${{ github.repository_owner }}
          REPOSITORY_PATH: ${{ github.repository }}
        run: |
          # Set GitHub registry credentials
          set_registry_credentials \
            'GITHUB_REGISTRY_URL' \
            'GITHUB_REGISTRY_IMAGES_PREFIX' \
            'GITHUB_REGISTRY_USERNAME' \
            'GITHUB_REGISTRY_TOKEN'

      - name: Set custom registry credentials
        if: vars.CUSTOM_REGISTRY_URL != ''
        env:
          REGISTRY_URL: ${{ vars.CUSTOM_REGISTRY_URL }}
          REGISTRY_USERNAME: ${{ vars.CUSTOM_REGISTRY_USERNAME }}
          REGISTRY_TOKEN: ${{ secrets.CUSTOM_REGISTRY_TOKEN }}
          REGISTRY_NAMESPACE: ${{ vars.CUSTOM_REGISTRY_NAMESPACE }}
          IMAGES_PREFIX: ${{ env.IMAGES_PREFIX }}
          REPOSITORY_OWNER: ${{ github.repository_owner }}
          REPOSITORY_PATH: ${{ github.repository }}
        run: |
          # Set custom registry credentials
          set_registry_credentials \
            'CUSTOM_REGISTRY_URL' \
            'CUSTOM_REGISTRY_IMAGES_PREFIX' \
            'CUSTOM_REGISTRY_USERNAME' \
            'CUSTOM_REGISTRY_TOKEN'

      # Execution steps

      - name: Login to Docker Hub registry
        # Only run if Docker Hub is configured
        if: env.DOCKER_REGISTRY_URL
        uses: docker/login-action@v3
        with:
          registry: ${{ env.DOCKER_REGISTRY_URL }}
          username: ${{ env.DOCKER_REGISTRY_USERNAME }}
          password: ${{ env.DOCKER_REGISTRY_TOKEN }}

      - name: Login to GitHub registry
        if: env.GITHUB_REGISTRY_URL
        uses: docker/login-action@v3
        with:
          registry: ${{ env.GITHUB_REGISTRY_URL }}
          username: ${{ env.GITHUB_REGISTRY_USERNAME }}
          password: ${{ env.GITHUB_REGISTRY_TOKEN }}

      - name: Login to custom registry
        if: env.CUSTOM_REGISTRY_URL
        uses: docker/login-action@v3
        with:
          registry: ${{ env.CUSTOM_REGISTRY_URL }}
          username: ${{ env.CUSTOM_REGISTRY_USERNAME }}
          password: ${{ env.CUSTOM_REGISTRY_TOKEN }}

      - name: Build for production
        env:
          IMAGES_PREFIX: 'app'
          IMAGES_TAG: ${{ github.sha }}
        run: |
          # docker compose build
          docker compose \
            -f ./docker-compose.yml \
            --env-file .env \
            build

      - name: Retag Docker images for GitHub Docker registry (tag commit SHA)
        env:
          IMAGES_PREFIX: 'app'
          IMAGES_TAG: ${{ github.sha }}
          NEW_IMAGES_PREFIX: ${{ env.GITHUB_REGISTRY_IMAGES_PREFIX }}
          NEW_IMAGES_TAG: ${{ github.sha }}
        run: |
          # docker tag for each image
          docker compose -f docker-compose.yml config --images | while read -r IMAGE; do
            echo "Retag '${IMAGE}' to '${NEW_IMAGES_PREFIX}:${NEW_IMAGES_TAG}'"
            docker tag "${IMAGE}" "${NEW_IMAGES_PREFIX}:${NEW_IMAGES_TAG}"
          done

      - name: Push Docker images to GitHub Docker registry (tag commit SHA)
        env:
          IMAGES_PREFIX: ${{ env.GITHUB_REGISTRY_IMAGES_PREFIX }}
          IMAGES_TAG: ${{ github.sha }}
        run: |
          # docker compose push
          docker compose \
            -f ./docker-compose.yml \
            --env-file .env \
            push

      - name: Retag Docker images for GitHub Docker registry (tag latest)
        # Only run in production
        if: env.DEPLOY_ENV == 'PROD'
        env:
          IMAGES_PREFIX: 'app'
          IMAGES_TAG: ${{ github.sha }}
          NEW_IMAGES_PREFIX: ${{ env.GITHUB_REGISTRY_IMAGES_PREFIX }}
          NEW_IMAGES_TAG: latest
        run: |
          # docker tag for each image
          docker compose -f docker-compose.yml config --images | while read -r IMAGE; do
            echo "Retag '${IMAGE}' to '${NEW_IMAGES_PREFIX}:${NEW_IMAGES_TAG}'"
            docker tag "${IMAGE}" "${NEW_IMAGES_PREFIX}:${NEW_IMAGES_TAG}"
          done

      - name: Push Docker images to GitHub Docker registry (tag latest)
        # Only run in production
        if: env.DEPLOY_ENV == 'PROD'
        env:
          IMAGES_PREFIX: ${{ env.GITHUB_REGISTRY_IMAGES_PREFIX }}
          IMAGES_TAG: latest
        run: |
          # docker compose push
          docker compose \
            -f ./docker-compose.yml \
            --env-file .env \
            push

      - name: Retag Docker images for Docker Hub registry (tag commit SHA)
        # Only run if Docker Hub is configured
        if: vars.DOCKER_REGISTRY_USERNAME
        env:
          IMAGES_PREFIX: 'app'
          IMAGES_TAG: ${{ github.sha }}
          NEW_IMAGES_PREFIX: ${{ env.DOCKER_REGISTRY_IMAGES_PREFIX }}
          NEW_IMAGES_TAG: ${{ github.sha }}
        run: |
          # docker tag for each image
          docker compose -f docker-compose.yml config --images | while read -r IMAGE; do
            echo "Retag '${IMAGE}' to '${NEW_IMAGES_PREFIX}:${NEW_IMAGES_TAG}'"
            docker tag "${IMAGE}" "${NEW_IMAGES_PREFIX}:${NEW_IMAGES_TAG}"
          done

      - name: Push Docker images to Docker Hub registry (tag commit SHA)
        # Only run if Docker Hub is configured
        if: vars.DOCKER_REGISTRY_USERNAME
        env:
          IMAGES_PREFIX: ${{ env.DOCKER_REGISTRY_IMAGES_PREFIX }}
          IMAGES_TAG: ${{ github.sha }}
        run: |
          # docker compose push
          docker compose \
            -f ./docker-compose.yml \
            --env-file .env \
            push

      - name: Retag Docker images for Docker Hub registry (tag latest)
        # Only run in production if Docker Hub is configured
        if: env.DEPLOY_ENV == 'PROD' && vars.DOCKER_REGISTRY_USERNAME
        env:
          IMAGES_PREFIX: 'app'
          IMAGES_TAG: ${{ github.sha }}
          NEW_IMAGES_PREFIX: ${{ env.DOCKER_REGISTRY_IMAGES_PREFIX }}
          NEW_IMAGES_TAG: latest
        run: |
          # docker tag for each image
          docker compose -f docker-compose.yml config --images | while read -r IMAGE; do
            echo "Retag '${IMAGE}' to '${NEW_IMAGES_PREFIX}:${NEW_IMAGES_TAG}'"
            docker tag "${IMAGE}" "${NEW_IMAGES_PREFIX}:${NEW_IMAGES_TAG}"
          done

      - name: Push Docker images to Docker Hub registry (tag latest)
        # Only run in production if Docker Hub is configured
        if: env.DEPLOY_ENV == 'PROD' && vars.DOCKER_REGISTRY_USERNAME
        env:
          IMAGES_PREFIX: ${{ env.DOCKER_REGISTRY_IMAGES_PREFIX }}
          IMAGES_TAG: latest
        run: |
          # docker compose push
          docker compose \
            -f ./docker-compose.yml \
            --env-file .env \
            push
